[package]
name = "genesis-core"
version = "0.1.0"
authors = ["Isaiah-54 <genesis@nearhackathon>"]
edition = "2021"
description = "Genesis core contract — agents that are born, earn, reproduce and die on NEAR"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.5"
near-contract-standards = "5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
