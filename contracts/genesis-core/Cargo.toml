[package]
name = "genesis-core"
version = "0.1.0"
authors = ["Isaiah-54 <genesis@nearhackathon>"]
edition = "2021"
description = "Genesis core contract — agents that are born, earn, reproduce and die on NEAR"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.5"
near-contract-standards = "5.5"
# near-sdk's own "abi" feature cannot be enabled for wasm32 (its schemars
# dep is host-only), so enable the abi feature on near-account-id directly:
# that gives AccountId its JsonSchema impl on wasm32 via feature unification.
near-account-id = { version = "3", features = ["abi"] }
borsh = "1"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Unit tests need near-sdk's unit-testing feature (feature unification makes
# it apply to the normal build too, so `cargo test` does not hit near-sdk's
# "use cargo near build" guard).
[dev-dependencies]
near-sdk = { version = "5.5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
